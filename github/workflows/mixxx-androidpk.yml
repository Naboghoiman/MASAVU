      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;$NDK_VERSION" "platforms;android-33" "build-tools;33.0.2"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Qt 6.7.3 host tools
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true

      - name: Locate host Qt
        shell: bash
        run: |
          set -euo pipefail
          HOST_QT="${IQTA_QT_PATH:-}"
          if [ -z "$HOST_QT" ] || [ ! -d "$HOST_QT" ]; then
            HOST_QT=$(find "$RUNNER_WORKSPACE/Qt" -maxdepth 4 -type d -name gcc_64 | head -n1)
          fi
          test -d "$HOST_QT"
          echo "QT_HOST_PATH=$HOST_QT" >> "$GITHUB_ENV"

      - name: Install Qt 6.7.3 Android arm64
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: qtmultimedia
          cache: true

      - name: Locate Android Qt
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_QT="${QT_ROOT_DIR:-}"
          if [ -z "$ANDROID_QT" ] || [ ! -f "$ANDROID_QT/lib/cmake/Qt6/qt.toolchain.cmake" ]; then
            ANDROID_QT=$(find "$RUNNER_WORKSPACE/Qt" -maxdepth 4 -type d -name android_arm64_v8a | head -n1)
          fi
          test -f "$ANDROID_QT/lib/cmake/Qt6/qt.toolchain.cmake"
          echo "QT_ANDROID_ROOT=$ANDROID_QT" >> "$GITHUB_ENV"

      - name: Clone exact Mixxx source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/mixxxdj/mixxx.git mixxx
          git -C mixxx checkout --detach "$MIXXX_COMMIT"
          test "$(git -C mixxx rev-parse HEAD)" = "$MIXXX_COMMIT"

      - name: Verify unchanged Mixxx synchronization files
        shell: bash
        run: |
          set -euo pipefail
          cd mixxx
          check_blob() {
            expected="$1"
            file="$2"
            actual="$(git hash-object "$file")"
            echo "$file  $actual"
            test "$actual" = "$expected"
          }
          check_blob 06e1371b2b9ae0ea2ef52a62a440c03301cbaed3 src/engine/sync/clock.h
          check_blob 19e37c132fb9f2d4ba5ecf31c12621a4a675dca6 src/engine/sync/enginesync.cpp
          check_blob cf8bcaf913bf145eb7fb8310524029e37b3f6aed src/engine/sync/enginesync.h
          check_blob 8cf819d5e2d28b0eca1cc4f2d3156ffdd466f7ee src/engine/sync/internalclock.cpp
          check_blob 7cf1c4bdd9d4d94b56dc502191f96de58d74b225 src/engine/sync/internalclock.h
          check_blob ea3bd1906c22162930659d950f8d4444e0aa509e src/engine/sync/syncable.h
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Configure Android app
        shell: bash
        run: |
          set -euo pipefail
          cmake -S android_mixxx_sync_test -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ANDROID_ROOT/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DMIXXX_SRC_DIR="$GITHUB_WORKSPACE/mixxx"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-android --target apk --parallel 2 2>&1 | tee android-build.log

      - name: Confirm Mixxx source was not modified
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C mixxx rev-parse HEAD)" = "$MIXXX_COMMIT"
          test -z "$(git -C mixxx status --porcelain --untracked-files=no)"

      - name: Collect APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find build-android -type f -name '*.apk' | head -n1)
          test -n "$APK"
          mkdir -p apk-output
          cp "$APK" apk-output/DJ_IMAN_MIXXX_SYNC_TEST.apk
          ls -lh apk-output/DJ_IMAN_MIXXX_SYNC_TEST.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DJ-IMAN-MIXXX-SYNC-TEST-APK
          path: apk-output/DJ_IMAN_MIXXX_SYNC_TEST.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DJ-IMAN-MIXXX-ANDROID-BUILD-LOG
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 14
